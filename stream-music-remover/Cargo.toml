[package]
name = "stream-music-remover"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# TLS through Windows itself (schannel): no C compiler needed to build, and it trusts the same
# certificates as the rest of the PC.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
